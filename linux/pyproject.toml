[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronbuddy-linux"
version = "2.1.0"
description = "Linux port of CronBuddy: minimalist tray & GTK3 scheduler for systemd user timers and cron."
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
cronbuddy = "cronbuddy_linux.cli:main"
cronbuddy-linux = "cronbuddy_linux.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cronbuddy_linux*"]
